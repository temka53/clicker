<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lucky Stars: Кликер</title>
<style>
:root{
  --night:#14183f; --panel:#20265c; --gold:#ffc94a; --ink:#f4f1ff; --muted:#9aa0d4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:manipulation;overflow:hidden}
header{text-align:center;padding:20px 16px 0}
#score{font-size:56px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-1px}
#rate{margin-top:6px;color:var(--muted);font-size:15px}
main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
#star{width:min(62vw,280px);height:min(62vw,280px);background:none;border:0;padding:0;cursor:pointer;
  filter:drop-shadow(0 0 28px rgba(255,201,74,.45));transition:transform .08s}
#star:active,#star.hit{transform:scale(.9) rotate(-4deg)}
#star:focus-visible{outline:3px solid var(--ink);outline-offset:6px;border-radius:50%}
.pop{position:absolute;font-weight:800;font-size:26px;color:var(--ink);pointer-events:none;
  animation:up .8s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
footer{width:100%;max-width:480px;padding:0 14px 16px;display:grid;gap:10px}
.up{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:14px 16px;
  font:inherit;text-align:left;cursor:pointer}
.up small{display:block;color:var(--muted);margin-top:2px}
.up b{color:var(--gold);white-space:nowrap}
.up:disabled{opacity:.5;cursor:default}
.up:not(:disabled):active{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}#star{transition:none}}
</style>
</head>
<body>
<header>
  <div id="score">0</div>
  <div id="rate"></div>
</header>
<main>
  <button id="star" aria-label="Собрать звёзды">
    <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
      <polygon points="50,6 62,36 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,36"
        fill="#ffc94a" stroke="#ffe08a" stroke-width="3" stroke-linejoin="round"/>
    </svg>
  </button>
</main>
<footer>
  <button class="up" id="u1"></button>
  <button class="up" id="u2"></button>
</footer>
<script>
(function(){
  var s={score:0,tap:1,auto:0};
  try{var d=JSON.parse(localStorage.getItem("ls_clicker")||"null");if(d)s=d}catch(e){}
  var $=function(i){return document.getElementById(i)};
  var cost1=function(){return Math.floor(50*Math.pow(1.6,s.tap-1))};
  var cost2=function(){return Math.floor(100*Math.pow(1.7,s.auto))};
  var fmt=function(n){return Math.floor(n).toLocaleString("ru-RU")};
  function save(){try{localStorage.setItem("ls_clicker",JSON.stringify(s))}catch(e){}}
  function render(){
    $("score").textContent=fmt(s.score);
    $("rate").textContent="+"+s.tap+" за тап"+(s.auto?", +"+s.auto+" в секунду":"");
    $("u1").innerHTML="<span>Сильный тап<small>+1 звезда за тап</small></span><b>"+fmt(cost1())+"</b>";
    $("u2").innerHTML="<span>Авто-звезда<small>+1 звезда в секунду</small></span><b>"+fmt(cost2())+"</b>";
    $("u1").disabled=s.score<cost1();
    $("u2").disabled=s.score<cost2();
  }
  $("star").addEventListener("pointerdown",function(e){
    s.score+=s.tap;
    var p=document.createElement("span");p.className="pop";p.textContent="+"+s.tap;
    var r=document.querySelector("main").getBoundingClientRect();
    p.style.left=(e.clientX-r.left-12)+"px";p.style.top=(e.clientY-r.top-30)+"px";
    document.querySelector("main").appendChild(p);
    p.addEventListener("animationend",function(){p.remove()});
    render();
  });
  $("u1").onclick=function(){var c=cost1();if(s.score>=c){s.score-=c;s.tap++;save();render()}};
  $("u2").onclick=function(){var c=cost2();if(s.score>=c){s.score-=c;s.auto++;save();render()}};
  setInterval(function(){if(s.auto){s.score+=s.auto;render()}},1000);
  setInterval(save,3000);
  document.addEventListener("visibilitychange",save);
  render();
})();
</script>
</body>
</html>
